modLoader = "javafml"
loaderVersion="[1,)"
license="${license}"
showAsResourcePack=false

[[mods]]
modId="${id}"
version="${modversion}"
displayName="${display_name}"
authors="${author}"
description="${description}"
logoFile="assets/${namespace}/textures/mod_logo.png"
displayURL = "https://github.com/${github}/${name}/"

[[dependencies."${id}"]]
modId="minecraft"
mandatory=true
versionRange="${mc}"
ordering="NONE"
side="BOTH"

[[dependencies."${id}"]]
modId="sodiumoptionsapi"
mandatory=false
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies."${id}"]]
modId="sodium"
mandatory=true
versionRange="[0.8,)"
ordering="AFTER"
side="CLIENT"

[modproperties."${id}"]
"sodium:config_api_user" = "toni.sodiumoptionsmodcompat.sodium.ModCompatConfigEntryPoint"
